name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Type Check (Web)
      run: npm run typecheck --workspace=apps/web --if-present
      
    - name: Type Check (API)
      run: npm run typecheck --workspace=apps/api --if-present

    - name: Prisma Validate
      run: npx prisma validate --schema=packages/database/prisma/schema.prisma

    - name: Build
      run: npm run build
